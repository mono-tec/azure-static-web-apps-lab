<!doctype html>
<html lang="ja">
<head>
  <!-- 文字コード設定 -->
  <meta charset="utf-8" />

  <!-- スマホ表示対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ページタイトル -->
  <title>Cloud Trial LP | Azure Static Web Apps Demo</title>

  <!-- 検索エンジン向け説明 -->
  <meta name="description" content="Azure Static Web Apps Free 検証用の雑なサンプルLPです。" />

  <!-- CSS 読み込み -->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <!-- =========================
       ヘッダー
       ========================= -->
  <header class="site-header">

    <!-- ロゴエリア -->
    <a class="brand" href="#top" aria-label="Cloud Trial LP Home">
      <span class="brand-mark">CT</span>
      <span>Cloud Trial LP</span>
    </a>

    <!-- ページ内リンク -->
    <nav class="nav" aria-label="メインナビゲーション">
      <a href="#features">特徴</a>
      <a href="#flow">検証手順</a>
      <a href="#contact">次の作業</a>
    </nav>
  </header>

  <main id="top">

    <!-- =========================
         メインビジュアル
         ========================= -->
    <section class="hero section">

      <!-- 説明エリア -->
      <div class="hero-copy">

        <p class="eyebrow">Azure Static Web Apps Free 検証用</p>

        <h1>
          GitHub Actions で<br />
          自動デプロイするLPサンプル
        </h1>

        <p class="lead">
          まずは見た目よりも構成確認を優先。
          HTML / CSS / JavaScript だけで動く、
          静的サイトのたたき台です。
        </p>

        <!-- ボタン -->
        <div class="hero-actions">
          <a class="button primary" href="#flow">検証の流れを見る</a>

          <a
            class="button ghost"
            href="https://github.com/"
            target="_blank"
            rel="noreferrer"
          >
            GitHubへ
          </a>
        </div>
      </div>

      <!-- デプロイ状態表示イメージ -->
      <div class="hero-card" aria-label="デプロイ状態のサンプルカード">

        <div class="status-dot"></div>

        <p class="card-label">Deployment Status</p>

        <strong>Ready for SWA</strong>

        <span>main ブランチへの push で公開</span>
      </div>
    </section>
